<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variable Font Tester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  color: #fff;
  font-family: sans-serif;
  padding: 40px;
  min-height: 100vh;
}

h1 { font-size: 14px; font-weight: 400; color: #888; margin-bottom: 32px; letter-spacing: 0.1em; text-transform: uppercase; }

.controls { display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; max-width: 700px; }

.row { display: flex; align-items: center; gap: 16px; }

.row label { font-size: 12px; color: #666; width: 80px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.08em; }

.row input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 2px;
  background: #333;
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}
.row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}

.row .val { font-size: 13px; color: #fff; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-family: monospace; }

.row input[type=text] {
  flex: 1;
  background: #1a1a1a;
  border: 1px solid #333;
  color: #fff;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 6px;
  outline: none;
}
.row input[type=text]:focus { border-color: #555; }

.font-drop {
  flex: 1;
  background: #1a1a1a;
  border: 1px solid #333;
  color: #fff;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 6px;
  outline: none;
  cursor: pointer;
}

.preview-area {
  background: #1a1a1a;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 48px 40px;
  min-height: 160px;
  display: flex;
  align-items: center;
  margin-bottom: 32px;
  max-width: 900px;
}

#preview-text {
  line-height: 1.3;
  width: 100%;
  word-break: break-word;
  color: #fff;
}

.compare-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  max-width: 900px;
  margin-bottom: 40px;
}

.compare-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 12px;
  border-radius: 8px;
  border: 1px solid #222;
  background: #1a1a1a;
  cursor: pointer;
  transition: border-color 0.1s;
  min-width: 72px;
}
.compare-item:hover { border-color: #444; }
.compare-item.active { border-color: #fff; }

.compare-item .sample { font-size: 22px; line-height: 1; color: #fff; }
.compare-item .wlabel { font-size: 10px; color: #555; text-align: center; line-height: 1.4; font-family: monospace; }

.drop-hint {
  border: 2px dashed #333;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  font-size: 13px;
  color: #555;
  cursor: pointer;
  max-width: 700px;
  transition: border-color 0.15s, color 0.15s;
}
.drop-hint:hover, .drop-hint.drag-over { border-color: #666; color: #888; }
.drop-hint input { display: none; }
</style>
</head>
<body>

<h1>Variable Font Tester</h1>

<div class="controls">
  <div class="row">
    <label>Шрифт</label>
    <select class="font-drop" id="font-select">
      <option value="Inter">Inter (если установлен)</option>
      <option value="system-ui">System UI</option>
      <option value="sans-serif">Sans-serif</option>
      <option value="serif">Serif</option>
      <option value="__custom__">— загруженный шрифт —</option>
    </select>
  </div>

  <div class="row">
    <label>Текст</label>
    <input type="text" id="custom-text" value="The quick brown fox jumps" />
  </div>

  <div class="row">
    <label>Weight</label>
    <input type="range" id="weight" min="100" max="900" step="1" value="400" />
    <span class="val" id="weight-val">400</span>
  </div>

  <div class="row">
    <label>Size</label>
    <input type="range" id="size" min="12" max="120" step="1" value="48" />
    <span class="val" id="size-val">48px</span>
  </div>

  <div class="row">
    <label>Spacing</label>
    <input type="range" id="spacing" min="-5" max="20" step="0.1" value="0" />
    <span class="val" id="spacing-val">0px</span>
  </div>

  <div class="row">
    <label>Opacity</label>
    <input type="range" id="opacity" min="5" max="100" step="1" value="100" />
    <span class="val" id="opacity-val">100%</span>
  </div>
</div>

<div class="preview-area">
  <div id="preview-text">The quick brown fox jumps</div>
</div>

<div class="compare-grid" id="compare-grid"></div>

<div class="drop-hint" id="drop-zone">
  <label>
    <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" />
    Перетащи сюда файл шрифта (.ttf / .otf / .woff2)<br>
    <span style="font-size:11px;color:#444;margin-top:4px;display:block;">или кликни чтобы выбрать</span>
  </label>
</div>

<script>
const weights = [100,200,300,400,500,600,700,800,900];
const wnames  = ['Thin','ExtraLight','Light','Regular','Medium','SemiBold','Bold','ExtraBold','Black'];

let customFontFamily = null;

const preview   = document.getElementById('preview-text');
const wSlider   = document.getElementById('weight');
const wVal      = document.getElementById('weight-val');
const sSlider   = document.getElementById('size');
const sVal      = document.getElementById('size-val');
const spSlider  = document.getElementById('spacing');
const spVal     = document.getElementById('spacing-val');
const oSlider   = document.getElementById('opacity');
const oVal      = document.getElementById('opacity-val');
const customTxt = document.getElementById('custom-text');
const fontSel   = document.getElementById('font-select');
const grid      = document.getElementById('compare-grid');

function currentFont() {
  if (fontSel.value === '__custom__' && customFontFamily) return customFontFamily;
  if (fontSel.value === '__custom__') return 'sans-serif';
  return fontSel.value;
}

function applyPreview() {
  const w  = wSlider.value;
  const s  = sSlider.value;
  const sp = parseFloat(spSlider.value).toFixed(1);
  const o  = oSlider.value;
  const f  = currentFont();

  preview.style.fontFamily    = f;
  preview.style.fontWeight    = w;
  preview.style.fontSize      = s + 'px';
  preview.style.letterSpacing = sp + 'px';
  preview.style.opacity       = o / 100;
  preview.textContent         = customTxt.value || 'Текст';

  wVal.textContent  = w;
  sVal.textContent  = s + 'px';
  spVal.textContent = sp + 'px';
  oVal.textContent  = o + '%';

  grid.querySelectorAll('.compare-item').forEach(el => {
    el.classList.toggle('active', el.dataset.w === w);
    el.querySelector('.sample').style.fontFamily = f;
  });
}

weights.forEach((w, i) => {
  const item = document.createElement('div');
  item.className = 'compare-item';
  item.dataset.w = w;
  item.innerHTML = `<span class="sample" style="font-weight:${w}">Ag</span><span class="wlabel">${w}<br>${wnames[i]}</span>`;
  item.addEventListener('click', () => { wSlider.value = w; applyPreview(); });
  grid.appendChild(item);
});

wSlider.addEventListener('input', applyPreview);
sSlider.addEventListener('input', applyPreview);
spSlider.addEventListener('input', applyPreview);
oSlider.addEventListener('input', applyPreview);
customTxt.addEventListener('input', applyPreview);
fontSel.addEventListener('change', applyPreview);

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('font-file');

function loadFontFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const name = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9]/g, '_');
    customFontFamily = 'CustomFont_' + name;
    const face = new FontFace(customFontFamily, e.target.result);
    face.load().then(loaded => {
      document.fonts.add(loaded);
      const opt = fontSel.querySelector('[value="__custom__"]');
      opt.textContent = '✓ ' + file.name;
      fontSel.value = '__custom__';
      applyPreview();
    });
  };
  reader.readAsArrayBuffer(file);
}

fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFontFile(e.target.files[0]); });
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFontFile(e.dataTransfer.files[0]);
});

applyPreview();
</script>
</body>
</html>
